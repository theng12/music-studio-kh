name: Desktop installers (unsigned development)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same branch supersedes runs still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            runtime: linux-x64
            bundles: deb,appimage
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            runtime: windows-x64
            bundles: nsis
          - os: macos-15-intel
            target: x86_64-apple-darwin
            runtime: macos-x64
            bundles: dmg
          - os: macos-15
            target: aarch64-apple-darwin
            runtime: macos-arm64
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: make mingw-w64-x86_64-gcc mingw-w64-x86_64-pkg-config
      # Pinned, checksum-verified downloads; reuse them instead of refetching each run.
      - uses: actions/cache@v4
        with:
          path: artifacts/tool-cache
          key: tool-downloads-${{ matrix.runtime }}-${{ hashFiles('packaging/runtime-tools.json') }}
      - uses: actions/cache@v4
        id: ffmpeg
        with:
          path: artifacts/native-ffmpeg
          key: ffmpeg-lgpl-v3-${{ matrix.runtime }}-9.0.2-lame3.100-${{ hashFiles('scripts/build-ffmpeg.sh') }}
          # Exact legacy cache uses the same verified sources and build flags.
          restore-keys: ffmpeg-lgpl-v2-${{ matrix.runtime }}-7e96a585d5fb73cb96967acf6898e005637aae89c110507880c1ba25ea593c8a
      - if: steps.ffmpeg.outputs.cache-matched-key == ''
        run: python scripts/prepare-runtime.py --target ${{ matrix.runtime }} --sources-only
      - if: steps.ffmpeg.outputs.cache-matched-key == '' && runner.os != 'Windows'
        shell: bash
        run: bash scripts/build-ffmpeg.sh "$PWD/artifacts/tool-cache/ffmpeg-9.0.2.tar.gz" "$PWD/artifacts/tool-cache/lame-3.100.tar.gz" "$PWD/artifacts/native-ffmpeg"
      - if: steps.ffmpeg.outputs.cache-matched-key == '' && runner.os == 'Windows'
        shell: msys2 {0}
        run: bash scripts/build-ffmpeg.sh "$PWD/artifacts/tool-cache/ffmpeg-9.0.2.tar.gz" "$PWD/artifacts/tool-cache/lame-3.100.tar.gz" "$PWD/artifacts/native-ffmpeg"
      - run: python scripts/prepare-runtime.py --target ${{ matrix.runtime }} --ffmpeg-dir artifacts/native-ffmpeg
      - shell: bash
        run: |
          src-tauri/runtime-tools/ffmpeg -version
          src-tauri/runtime-tools/ffprobe -version
          src-tauri/runtime-tools/yt-dlp --version
          src-tauri/runtime-tools/deno --version
      - run: npm ci
      - run: npm run build:web
      - shell: bash
        run: |
          mkdir -p src-tauri/binaries
          suffix=""
          if [ "$RUNNER_OS" = Windows ]; then suffix=.exe; fi
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "src-tauri/binaries/tuneharbor-server-${{ matrix.target }}$suffix" ./cmd/tuneharbor
          chmod +x src-tauri/binaries/*
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - run: python scripts/collect-notices.py
      - run: npm run build:desktop -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
      - run: python scripts/install-smoke.py --target ${{ matrix.target }}
      - name: Desktop end-to-end (installed package, virtual display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb openbox gnome-keyring xdotool imagemagick webkit2gtk-driver
          cargo install tauri-driver --locked
          sudo apt-get install -y ./src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
          scripts/desktop-e2e.sh
      - if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-screenshots
          path: artifacts/desktop-*.png
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: TuneHarbor-unsigned-dev-${{ matrix.runtime }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
          if-no-files-found: error
          retention-days: 14

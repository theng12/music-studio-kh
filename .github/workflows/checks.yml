name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same branch supersedes runs still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    strategy:
      fail-fast: false
      matrix:
        # Linux on every push; Windows and macOS (2x/10x minutes) when run by hand.
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-24.04","windows-latest","macos-latest"]') || fromJSON('["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/tuneharbor
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:web
      - name: Embedded web assets match the UI source
        run: git diff --exit-code -- internal/server/web && test -z "$(git status --porcelain -- internal/server/web)"
      - run: go build -o bin/tuneharbor ./cmd/tuneharbor
      - run: go build -o bin/fixture-server ./tests/fixtures/server
      - run: npm run test:browser
      - run: node scripts/downloads-smoke.mjs
